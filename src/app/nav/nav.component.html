<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <header class="header">
        
        <label for="" class="logo">L O G O</label>

        <input type="checkbox" id="check">
        <label for="check" class="icons">
            <i class='bx bx-menu' id="menu"></i>
            <i class='bx bx-x' id="x"></i>
        </label>

        <nav class="navbar">
            <a href="#" style="--i:0;">H T M L / C S S</a>
            <a href="#" style="--i:1;">T Y P E S C R I P T</a>
            <a href="#" style="--i:2;">P Y T H O N</a>
            <a href="#" style="--i:3;">A B O U T</a>
        </nav>
    </header>
</body>
</html>
